name = "brandilab-api"
main = "src/index.js"
compatibility_date = "2024-09-23"

# Environment variables to be set via `wrangler secret put` or Cloudflare Dashboard:
# - STRIPE_SECRET_KEY
# - SNIPCART_SECRET_API_KEY

[vars]
SITE_URL = "https://www.brandilab.it"
# Contact form (src/contact.js). CONTACT_FROM must be an address on a domain with
# Cloudflare Email Routing enabled; the destination must be a verified Email Routing address.
CONTACT_FROM = "sito@brandilab.it"
CONTACT_TO = "brandilab3d@gmail.com"

[[send_email]]
name = "CONTACT_EMAIL"
destination_address = "brandilab3d@gmail.com"
