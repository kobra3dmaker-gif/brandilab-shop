<!DOCTYPE html>
<html lang="it">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="BrandiLab — Creazioni stampate in 3D di alta qualità, realizzate con precisione. Scopri supporti per smartphone, statuine decorative, vasi e molto altro.">
    <title>BrandiLab — Creazioni stampate in 3D</title>
    <meta name="color-scheme" content="light dark">

    <!-- Icons & app manifest -->
    <link rel="icon" href="/favicon.ico" sizes="48x48">
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png">
    <link rel="apple-touch-icon" href="/apple-touch-icon.png">
    <link rel="manifest" href="/site.webmanifest">
    <meta name="theme-color" content="#26326e">

    <!-- Social sharing (Open Graph / Twitter) -->
    <meta property="og:type" content="website">
    <meta property="og:site_name" content="BrandiLab">
    <meta property="og:title" content="BrandiLab — Creazioni stampate in 3D">
    <meta property="og:description" content="Creazioni stampate in 3D di alta qualità, realizzate con precisione.">
    <meta property="og:locale" content="it_IT">
    <meta property="og:locale:alternate" content="en_GB">
    <meta property="og:url" content="https://brandilab.it/">
    <meta property="og:image" content="https://brandilab.it/og-image.jpg">
    <meta property="og:image:width" content="1200">
    <meta property="og:image:height" content="630">
    <meta name="twitter:card" content="summary_large_image">

    <!-- Apply the light/dark theme and the language before the first paint (theme kept in sync by src/composables/useTheme.ts) -->
    <script>
      (function () {
        var theme = null
        try { theme = localStorage.getItem('theme') } catch (e) {}
        if (theme !== 'light' && theme !== 'dark') {
          theme = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'
        }
        document.documentElement.dataset.theme = theme
      })()

      // Language (kept in sync by src/i18n/index.ts): saved choice → browser language → Italian
      ;(function () {
        var lang = null
        try { lang = localStorage.getItem('locale') } catch (e) {}
        if (lang !== 'it' && lang !== 'en') {
          lang = 'it'
          var preferred = navigator.languages && navigator.languages.length ? navigator.languages : [navigator.language]
          for (var i = 0; i < preferred.length; i++) {
            var base = String(preferred[i] || '').toLowerCase().split('-')[0]
            if (base === 'it' || base === 'en') { lang = base; break }
          }
        }
        document.documentElement.lang = lang
      })()
    </script>

    <!-- Google Fonts: Inter -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

    <!-- Snipcart CSS -->
    <link rel="stylesheet" href="https://cdn.snipcart.com/themes/v3.0.31/default/snipcart.css" />
  </head>
  <body>
    <!-- GitHub Pages SPA redirect handler (companion to 404.html) -->
    <script>
      (function(l) {
        if (l.search[1] === '/') {
          var decoded = l.search.slice(1).split('&').map(function(s) {
            return s.replace(/~and~/g, '&')
          }).join('?');
          window.history.replaceState(null, null, l.pathname.slice(0, -1) + decoded + l.hash);
        }
      }(window.location))
    </script>
    <div id="app"></div>

    <!-- Snipcart JS & Configuration -->
    <script async src="https://cdn.snipcart.com/themes/v3.0.31/default/snipcart.js"></script>
    <!--
      Keep exactly ONE #snipcart element: Snipcart only reads the first one.
      - data-api-key: your Snipcart PUBLIC API key (Dashboard → Account → API Keys).
        Use the TEST key while testing, switch to the LIVE key for real payments.
      - data-currency: every price on the site is in euros. EUR must also be enabled
        in the Snipcart Dashboard → Regional Settings.
      - Payments go through the Stripe account connected in Dashboard → Payment Gateway.
    -->
    <div hidden id="snipcart"
      data-api-key="MmU3ZmM4YjQtOTYzZC00ZDliLWEwNWItZjBkOTNjNzk5ZTg2NjM5MjUxMDIxODAxNjU1ODAy"
      data-currency="eur"
    ></div>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
