<!DOCTYPE html>
<html lang="it">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="BrandiLab — Creazioni stampate in 3D di alta qualità, realizzate con precisione. Scopri supporti per smartphone, statuine decorative, vasi e molto altro.">
    <title>BrandiLab — Creazioni stampate in 3D</title>
    <meta name="color-scheme" content="light dark">

    <!-- Icons & app manifest -->
    <link rel="icon" href="/favicon.ico" sizes="48x48">
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png">
    <link rel="apple-touch-icon" href="/apple-touch-icon.png">
    <link rel="manifest" href="/site.webmanifest">
    <meta name="theme-color" content="#26326e">

    <!-- Social sharing (Open Graph / Twitter) -->
    <meta property="og:type" content="website">
    <meta property="og:site_name" content="BrandiLab">
    <meta property="og:title" content="BrandiLab — Creazioni stampate in 3D">
    <meta property="og:description" content="Creazioni stampate in 3D di alta qualità, realizzate con precisione.">
    <meta property="og:locale" content="it_IT">
    <meta property="og:locale:alternate" content="en_GB">
    <meta property="og:url" content="https://brandilab.it/">
    <meta property="og:image" content="https://brandilab.it/og-image.jpg">
    <meta property="og:image:width" content="1200">
    <meta property="og:image:height" content="630">
    <meta name="twitter:card" content="summary_large_image">

    <!-- Apply the light/dark theme and the language before the first paint (theme kept in sync by src/composables/useTheme.ts) -->
    <script>
      (function () {
        var theme = null
        try { theme = localStorage.getItem('theme') } catch (e) {}
        if (theme !== 'light' && theme !== 'dark') {
          theme = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'
        }
        document.documentElement.dataset.theme = theme
      })()

      // Language (kept in sync by src/i18n/index.ts): saved choice → browser language → Italian
      ;(function () {
        var lang = null
        try { lang = localStorage.getItem('locale') } catch (e) {}
        if (lang !== 'it' && lang !== 'en') {
          lang = 'it'
          var preferred = navigator.languages && navigator.languages.length ? navigator.languages : [navigator.language]
          for (var i = 0; i < preferred.length; i++) {
            var base = String(preferred[i] || '').toLowerCase().split('-')[0]
            if (base === 'it' || base === 'en') { lang = base; break }
          }
        }
        document.documentElement.lang = lang
      })()
    </script>

    <!--
      Google Analytics 4 with Consent Mode (see src/analytics.ts).
      gtag() has to exist before Snipcart starts, so Snipcart's GA integration sends the
      e-commerce events (add_to_cart, begin_checkout, purchase…). Until the visitor accepts
      the cookie banner, gtag.js is not even downloaded: calls just queue up in the page.
    -->
    <script>
      window.dataLayer = window.dataLayer || []
      function gtag() { dataLayer.push(arguments) }
      ;(function () {
        var consent = null
        try { consent = localStorage.getItem('analytics-consent') } catch (e) {}
        gtag('consent', 'default', {
          analytics_storage: consent === 'granted' ? 'granted' : 'denied',
          ad_storage: 'denied',
          ad_user_data: 'denied',
          ad_personalization: 'denied',
          wait_for_update: 500,
        })
      })()
      gtag('js', new Date())
      gtag('config', '%VITE_GA_MEASUREMENT_ID%')
    </script>

    <!-- Google Fonts: Inter -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  </head>
  <body>
    <!-- GitHub Pages SPA redirect handler (companion to 404.html) -->
    <script>
      (function(l) {
        if (l.search[1] === '/') {
          var decoded = l.search.slice(1).split('&').map(function(s) {
            return s.replace(/~and~/g, '&')
          }).join('?');
          window.history.replaceState(null, null, l.pathname.slice(0, -1) + decoded + l.hash);
        }
      }(window.location))
    </script>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
