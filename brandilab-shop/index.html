<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="BrandiLab — Premium 3D printed creations handcrafted with precision. Shop unique smartphone stands, decorative figures, planters, and more.">
    <title>BrandiLab — 3D Printed Creations</title>
    <meta name="color-scheme" content="light dark">

    <!-- Icons & app manifest -->
    <link rel="icon" href="/favicon.ico" sizes="48x48">
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png">
    <link rel="apple-touch-icon" href="/apple-touch-icon.png">
    <link rel="manifest" href="/site.webmanifest">
    <meta name="theme-color" content="#26326e">

    <!-- Social sharing (Open Graph / Twitter) -->
    <meta property="og:type" content="website">
    <meta property="og:site_name" content="BrandiLab">
    <meta property="og:title" content="BrandiLab — 3D Printed Creations">
    <meta property="og:description" content="Premium 3D printed creations handcrafted with precision.">
    <meta property="og:url" content="https://brandilab.it/">
    <meta property="og:image" content="https://brandilab.it/og-image.jpg">
    <meta property="og:image:width" content="1200">
    <meta property="og:image:height" content="630">
    <meta name="twitter:card" content="summary_large_image">

    <!-- Apply the light/dark theme before the first paint (kept in sync by src/composables/useTheme.ts) -->
    <script>
      (function () {
        var theme = null
        try { theme = localStorage.getItem('theme') } catch (e) {}
        if (theme !== 'light' && theme !== 'dark') {
          theme = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'
        }
        document.documentElement.dataset.theme = theme
      })()
    </script>

    <!-- Google Fonts: Inter -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

    <!-- Snipcart CSS -->
    <link rel="stylesheet" href="https://cdn.snipcart.com/themes/v3.0.31/default/snipcart.css" />
  </head>
  <body>
    <!-- GitHub Pages SPA redirect handler (companion to 404.html) -->
    <script>
      (function(l) {
        if (l.search[1] === '/') {
          var decoded = l.search.slice(1).split('&').map(function(s) {
            return s.replace(/~and~/g, '&')
          }).join('?');
          window.history.replaceState(null, null, l.pathname.slice(0, -1) + decoded + l.hash);
        }
      }(window.location))
    </script>
    <div id="app"></div>

    <!-- Snipcart JS & API Key -->
    <!-- Snipcart JS & Configuration -->
    <script async src="https://cdn.snipcart.com/themes/v3.0.31/default/snipcart.js"></script>
    <!-- TODO: Replace YOUR_PUBLIC_API_KEY_HERE with your actual Snipcart public API key -->
    <div hidden id="snipcart" data-api-key="YjNjM2RkNjktZjk3YS00MTgyLTg3ZTItMmNjNTMzZjBiODM1NjM5MjUxMDIxODAxNjU1ODAy"></div>
    <!--
      PAYMENT SETUP:
      1. Replace the data-api-key below with your Snipcart PUBLIC API key
         (found in your Snipcart Dashboard → Account → API Keys)
      2. In the Snipcart Dashboard → Payment Gateway, connect your Stripe account
         Snipcart uses Stripe as its payment processor — you just link your
         Stripe account in the Snipcart dashboard and it handles everything.
      3. Set currency to EUR in Snipcart Dashboard → Regional Settings
      
      For testing: use your Snipcart TEST API key (starts with a different prefix)
      For production: switch to the LIVE API key after testing
    -->
    <div hidden id="snipcart"
      data-api-key="MmU3ZmM4YjQtOTYzZC00ZDliLWEwNWItZjBkOTNjNzk5ZTg2NjM5MjUxMDIxODAxNjU1ODAy"
      data-currency="eur"
      data-config-modal-style="side"
    ></div>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
