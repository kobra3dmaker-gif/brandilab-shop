<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>BrandiLab — Product Validation</title>
  <!--
    This page is used by Snipcart's product crawler to validate prices.
    When a customer adds an item to their cart, Snipcart crawls the data-item-url
    and checks that the price in the HTML matches the price submitted by the browser.
    This prevents price tampering.

    All products are listed here with their Snipcart data attributes.
    This page is NOT meant to be visited by users — it's a machine-readable endpoint.
  -->
</head>

</html>
