<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <title>BrandiLab — Redirecting…</title>
    <script>
      // GitHub Pages SPA redirect hack.
      // When GH Pages can't find a file (e.g. /admin-dashboard), it serves 404.html.
      // This script redirects to index.html, encoding the original path as a query param
      // so the SPA can restore the correct route on load.
      var pathSegmentsToKeep = 0; // 0 for custom domains (brandilab.it)
      var l = window.location;
      l.replace(
        l.protocol + '//' + l.hostname + (l.port ? ':' + l.port : '') +
        l.pathname.split('/').slice(0, 1 + pathSegmentsToKeep).join('/') + '/?/' +
        l.pathname.slice(1).split('/').slice(pathSegmentsToKeep).join('/').replace(/&/g, '~and~') +
        (l.search ? '&' + l.search.slice(1).replace(/&/g, '~and~') : '') +
        l.hash
      );
    </script>
  </head>
  <body>
  </body>
</html>
